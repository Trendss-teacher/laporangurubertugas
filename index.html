	<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/sitesv/AG8ngQXUOzdEyGc_Rn6KL4ECIMkgviCX3rUZac-Vae7By1NTJYXXmzFfv-srSHr9r6j5XKFA5MqBLE3nMOTwbPcjV1RGL2zhme4OM9RhdYwozPxkCTnXsW8Is9XTSGlg-46dGkjAjOGXcXF8CLDKSczOVVcSTi1nhNUneU-mvkcxfNy_z6FLKM4_sFms99ZsS4U=w1280">
    <meta charset="UTF-8">

    <title>Laporan Guru Bertugas SMKKT</title>

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

        @media print { .no-print { display: none !important; } }

            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .mobile-table-scroll table {
            min-width: 720px;
        }
        @media (max-width: 767px) {

<body>
    <div id="root"></div>
<script type="text/babel">
        // Gantikan dengan URL Web App Apps Script anda (Deploy > New deployment)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6mGf_m7gCc3uKzEOcl7sDmsmx7fSUCVE_5K4fU5rlj9Y_tzNo1OdLSI4uGS4j2nrD7Q/exec";

        // [TAMPAL KOD JAVASCRIPT KESELURUHAN DI SINI] 
        // Nota: Kerana kod ini panjang, pastikan cikgu ambil daripada baris "const DUTIES = [...]" 
        // sehingga ke bahagian "root.render(<App />);"
	const DUTIES = [
            { id: 1, title: "MENGURUS PERHIMPUNAN PAGI DAN CATATAN", short: "Perhimpunan" },
            { id: 2, title: "MENGAWAL PINTU MASUK PAGI", short: "Pintu Masuk" },
            { id: 3, title: "KAWALAN WAKTU REHAT DI KANTIN", short: "Kantin/Rehat" },
            { id: 4, title: "RONDAAN BLOK, SURAU DAN TANDAS", short: "Rondaan" },
            { id: 5, title: "LAPORAN KEHADIRAN, SAKIT DAN AKTIVITI", short: "Kehadiran & Aktiviti" }
        ];

        // Global handlePrint function to fix browser scope issues
        window.handlePrint = function() {
            setTimeout(() => {
                window.focus();
                window.print();
            }, 200);
        };

        const LoginScreen = ({ onLogin, teachers, loading }) => {
            const [selectedId, setSelectedId] = React.useState('');
            const [ic, setIc] = React.useState('');
            const [error, setError] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const user = teachers.find(t => t.id === selectedId);
                if (user && String(user.ic_last4).trim() === String(ic).trim()) {
                    onLogin(user);
                } else {
                    setError('Akaun atau 4 digit IC terakhir tidak sah.');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-800 relative">
                    <div className="absolute inset-0 bg-teal-900 opacity-90 z-0"></div>
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10 overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 to-teal-500"></div>
                        <div className="text-center mb-8">
                            <i className="ph-fill ph-book-open text-6xl text-teal-600 mb-3 inline-block"></i>
                            <h2 className="text-2xl font-bold text-slate-800">SMK KEM TERENDAK</h2>
                            <p className="text-slate-500 font-medium">Sistem Laporan Guru Bertugas</p>
                        </div>
                        
                        {loading ? (
                            <div className="text-center py-4 mb-4 text-sm bg-teal-50 text-teal-700 rounded-lg font-medium animate-pulse border border-teal-200 flex flex-col items-center gap-2">
                                <i className="ph-bold ph-spinner animate-spin text-2xl"></i>
                                Memuat turun pangkalan data dari Google Sheet...
                            </div>
                        ) : (
                            <>
                                {error && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm flex items-center gap-2 border border-red-200">
                                        <i className="ph-fill ph-warning-circle text-lg"></i> {error}
                                    </div>
                                )}

                                <form onSubmit={handleLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Pilih Nama Guru / Staf</label>
                                        <select 
                                            className="w-full border border-slate-300 rounded-lg p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition"
                                            value={selectedId}
                                            onChange={(e) => setSelectedId(e.target.value)}
                                            required
                                        >
                                            <option value="" disabled>-- Sila Pilih Nama Anda --</option>
                                            {teachers.map(t => (
                                                <option key={t.id} value={t.id}>{t.name} {t.role === 'admin' ? '(Admin)' : ''}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">4 Digit Akhir Kad Pengenalan</label>
                                        <input 
                                            type="password"
                                            maxLength="4"
                                            placeholder="Cth: 5954"
                                            className="w-full border border-slate-300 rounded-lg p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition"
                                            value={ic}
                                            onChange={(e) => setIc(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2 mt-4">
                                        <i className="ph-bold ph-sign-in text-lg"></i> Log Masuk Aplikasi
                                    </button>
                                </form>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const FormSection = ({ title, icon, children }) => (
            <div className="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200 mt-6 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-1.5 h-full bg-teal-600"></div>
                <h3 className="text-xl font-bold text-teal-800 mb-5 flex items-center gap-3 border-b pb-3">
                    <div className="bg-teal-100 p-2 rounded-lg text-teal-700">
                        <i className={`ph-fill ${icon} text-2xl`}></i>
                    </div>
                    {title}
                </h3>
                {children}
            </div>
        );

        const RadioGroup = ({ label, options, value, onChange }) => (
            <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">{label}</label>
                <div className="flex flex-wrap gap-2 md:gap-3">
                    {options.map(opt => (
                        <label key={opt} className={`cursor-pointer px-4 py-2 rounded border text-sm font-medium transition-all ${value === opt ? 'bg-teal-600 text-white border-teal-600 shadow-sm' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-300'}`}>
                            <input type="radio" className="hidden" name={label} value={opt} checked={value === opt} onChange={() => onChange(opt)} />
                            {opt}
                        </label>
                    ))}
                </div>
            </div>
        );

        const ImageUpload = ({ imagePreview, setImagePreview, label }) => {
            const MAX_ORIGINAL_SIZE_MB = 5;
            const MAX_ORIGINAL_SIZE = MAX_ORIGINAL_SIZE_MB * 1024 * 1024;

            const compressImage = (file, maxWidth = 1280, quality = 0.72) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();

                    reader.onload = (event) => {
                        const img = new Image();

                        img.onload = () => {
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d', { alpha: false });
                            ctx.drawImage(img, 0, 0, width, height);

                            // Semua gambar dihantar sebagai JPEG yang telah dikecilkan.
                            const compressed = canvas.toDataURL('image/jpeg', quality);

                            resolve({
                                dataUrl: compressed,
                                width,
                                height
                            });
                        };

                        img.onerror = () => reject(new Error('Gagal membaca gambar.'));
                        img.src = event.target.result;
                    };

                    reader.onerror = () => reject(new Error('Gagal membaca fail gambar.'));
                    reader.readAsDataURL(file);
                });
            };

            const formatFileSize = (bytes) => {
                if (bytes < 1024) return `${bytes} B`;
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
                return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            };

            const handleImage = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    if (!file.type.startsWith('image/')) {
                        alert('Sila pilih fail gambar sahaja.');
                        e.target.value = '';
                        return;
                    }

                    // Beri amaran untuk fail asal yang besar.
                    if (file.size > MAX_ORIGINAL_SIZE) {
                        const proceed = window.confirm(
                            `Saiz gambar yang dipilih ialah ${formatFileSize(file.size)}.\n\n` +
                            `Had yang disyorkan ialah ${MAX_ORIGINAL_SIZE_MB} MB.\n` +
                            `Sistem akan mengecilkan gambar secara automatik sebelum dihantar.\n\n` +
                            `Teruskan?`
                        );

                        if (!proceed) {
                            e.target.value = '';
                            return;
                        }
                    }

                    const result = await compressImage(file);
                    setImagePreview(result.dataUrl);

                } catch (error) {
                    console.error('Gagal proses gambar:', error);
                    alert('Gambar gagal diproses. Sila cuba gambar lain yang lebih kecil.');
                    e.target.value = '';
                }
            };

            return (
                <div className="mt-6 border-t border-slate-100 pt-4">
                    <label className="block text-sm font-bold text-slate-700 mb-2">{label}</label>
                    <p className="text-xs text-slate-500 mb-3">
                        Saiz fail asal disyorkan ≤ {MAX_ORIGINAL_SIZE_MB} MB. Gambar yang besar akan dipaparkan amaran dan dikecilkan secara automatik.
                    </p>
                    <div className="flex flex-col sm:flex-row items-start gap-4">
                        <label className="cursor-pointer bg-slate-50 border-2 border-dashed border-slate-300 hover:border-teal-500 rounded-lg p-6 flex flex-col items-center justify-center w-full sm:w-1/2 transition h-40">
                            <i className="ph ph-image text-4xl text-slate-400 mb-3"></i>
                            <span className="text-sm font-medium text-slate-600">Klik untuk Muat Naik Gambar</span>
                            <span className="text-xs text-slate-400 mt-1">JPG, PNG, WEBP</span>
                            <span className="text-xs text-amber-600 mt-2 font-medium">Maksimum disyorkan: {MAX_ORIGINAL_SIZE_MB} MB</span>
                            <input type="file" accept="image/*" onChange={handleImage} className="hidden" />
                        </label>
                        {imagePreview && (
                            <div className="relative w-full sm:w-1/2 h-40 rounded-lg border overflow-hidden shadow-sm group bg-slate-100 flex items-center justify-center">
                                <img src={imagePreview} className="w-full h-full object-contain" alt="Preview" />
                                <button type="button" onClick={() => setImagePreview(null)} className="absolute top-2 right-2 bg-red-500 text-white rounded p-1.5 shadow hover:bg-red-600 transition flex items-center gap-1 text-xs font-medium">
                                    <i className="ph-bold ph-trash"></i> Padam
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [teachers, setTeachers] = React.useState([]);
            const [loadingTeachers, setLoadingTeachers] = React.useState(true);
            const [currentUser, setCurrentUser] = React.useState(null);
            const [reports, setReports] = React.useState({});
            const [currentView, setCurrentView] = React.useState('login'); 
            const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [toastMessage, setToastMessage] = React.useState(null);
            
            // Tarik data guru dan laporan sedia ada dari Google Sheet apabila aplikasi dibuka
            React.useEffect(() => {
                if (GOOGLE_SCRIPT_URL) {
                    fetch(GOOGLE_SCRIPT_URL)
                        .then(res => res.json())
                        .then(data => {
                            // Kod backend yang dikemas kini mengembalikan {teachers: [], reports: {}}
                            if (data.teachers && Array.isArray(data.teachers)) {
                                setTeachers(data.teachers);
                            } else if (Array.isArray(data)) {
                                setTeachers(data); // Fallback ke struktur lama
                            }

                            if (data.reports) {
                                setReports(data.reports);
                            }
                            
                            setLoadingTeachers(false);
                        })
                        .catch(err => {
                            console.error("Gagal muat data dari Google Sheet:", err);
                            setLoadingTeachers(false);
                        });
                }
            }, []);

            const getDayName = (dateString) => {
                const days = ['AHAD', 'ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU'];
                const d = new Date(dateString);
                return isNaN(d) ? '' : days[d.getDay()];
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const handleLogin = (user) => {
                setCurrentUser(user);
                setCurrentView(user.role === 'admin' ? 'admin' : 'form');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setCurrentView('login');
            };

            const saveReport = async (date, dutyId, data) => {
                const existingReport = reports[date]?.tasks?.[String(dutyId)] || reports[date]?.tasks?.[dutyId];

                // KUNCI DI FRONTEND: guru lain tidak boleh edit tugas yang telah diisi.
                if (existingReport) {
                    const ownerId = existingReport.teacherId || '';
                    const ownerName = String(existingReport.teacherName || '').trim();
                    const currentId = String(currentUser.id || '').trim();
                    const currentName = String(currentUser.name || '').trim();

                    const isOwner = ownerId
                        ? ownerId === currentId
                        : ownerName === currentName;

                    if (!isOwner) {
                        showToast(`Tugasan ini telah diisi oleh ${ownerName}. Anda tidak boleh mengeditnya.`);
                        return;
                    }
                }

                showToast('Laporan sedang dihantar ke Google Sheet...');

                if (!GOOGLE_SCRIPT_URL) {
                    showToast('URL Google Apps Script belum ditetapkan.');
                    return;
                }

                try {
                    const payload = {
                        date: date,
                        day: getDayName(date),
                        week: data.week || '',
                        dutyId: Number(dutyId),
                        teacherId: currentUser.id,
                        teacherName: currentUser.name,
                        taskData: data,
                        image: data.image || ''
                    };

                    // text/plain mengelakkan preflight CORS.
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8'
                        },
                        body: JSON.stringify(payload)
                    });

                    // Paparkan perubahan di skrin selepas request dihantar.
                    setReports(prev => {
                        const existingDay = prev[date] || {
                            date: date,
                            day: getDayName(date),
                            week: data.week || '',
                            status: 'pending',
                            tasks: {},
                            teachers: [],
                            admin_comment: ''
                        };

                        const existingTasks = { ...existingDay.tasks };
                        const existingTeachers = [...(existingDay.teachers || [])];

                        existingTasks[String(dutyId)] = {
                            ...data,
                            teacherName: currentUser.name,
                            teacherId: currentUser.id
                        };

                        const teacherEntry = {
                            name: currentUser.name,
                            teacherId: currentUser.id,
                            dutyId: Number(dutyId)
                        };

                        const idx = existingTeachers.findIndex(
                            t => String(t.dutyId) === String(dutyId)
                        );

                        if (idx >= 0) {
                            existingTeachers[idx] = teacherEntry;
                        } else {
                            existingTeachers.push(teacherEntry);
                        }

                        const newDay = {
                            ...existingDay,
                            week: data.week || existingDay.week,
                            tasks: existingTasks,
                            teachers: existingTeachers,
                            status: Object.keys(existingTasks).length === 5
                                ? 'completed'
                                : 'pending'
                        };

                        return {
                            ...prev,
                            [date]: newDay
                        };
                    });

                    showToast('Laporan telah dihantar.');

                } catch (error) {
                    console.error('Gagal hantar ke Google Apps Script:', error);
                    showToast('Gagal menghantar laporan. Sila cuba lagi.');
                }
            };
            if (currentView === 'login') {
                return <LoginScreen onLogin={handleLogin} teachers={teachers} loading={loadingTeachers} />;
            }

            return (
                <div className="min-h-screen flex flex-col relative bg-slate-100">
                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-2xl z-50 flex items-center gap-3 animate-bounce no-print">
                            <i className="ph-fill ph-check-circle text-teal-400 text-xl"></i>
                            <span className="font-medium">{toastMessage}</span>
                        </div>
                    )}

                    <nav className="bg-teal-700 text-white shadow-md p-4 no-print relative z-10">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <i className="ph-fill ph-book-open text-3xl text-amber-300"></i>
                                <div>
                                    <h1 className="font-bold text-lg tracking-wide">SMK KEM TERENDAK</h1>
                                    <p className="text-xs text-teal-100">Sistem Laporan Guru Bertugas</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm hidden sm:inline-block font-medium">
                                    <i className="ph-fill ph-user-circle mr-1"></i> {currentUser.name}
                                </span>
                                {currentView === 'report' && (
                                    <button onClick={() => setCurrentView(currentUser.role === 'admin' ? 'admin' : 'list')} className="text-sm bg-teal-600 hover:bg-teal-500 px-3 py-1.5 rounded transition shadow-sm font-medium">
                                        <i className="ph ph-arrow-left mr-1"></i> Kembali
                                    </button>
                                )}
                                <button onClick={handleLogout} className="text-sm bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded transition flex items-center shadow-sm font-medium">
                                    <i className="ph ph-sign-out mr-1"></i> Keluar
                                </button>
                            </div>
                        </div>
                    </nav>

                    {currentUser.role === 'guru' && currentView !== 'report' && (
                        <div className="bg-teal-800 text-white shadow-inner no-print flex justify-center gap-1 sm:gap-4 px-2 sm:px-4 pt-3">
                            <button 
                                onClick={() => setCurrentView('form')} 
                                className={`py-2 px-4 sm:px-6 rounded-t-lg font-bold transition-colors flex items-center gap-2 ${currentView === 'form' ? 'bg-slate-100 text-teal-800 shadow-md' : 'bg-teal-700 hover:bg-teal-600 text-teal-100'}`}
                            >
                                <i className="ph-bold ph-pencil-simple"></i> Isi Laporan
                            </button>
                            <button 
                                onClick={() => setCurrentView('list')} 
                                className={`py-2 px-4 sm:px-6 rounded-t-lg font-bold transition-colors flex items-center gap-2 ${currentView === 'list' ? 'bg-slate-100 text-teal-800 shadow-md' : 'bg-teal-700 hover:bg-teal-600 text-teal-100'}`}
                            >
                                <i className="ph-bold ph-files"></i> Papar Laporan Penuh
                            </button>
                        </div>
                    )}

                    <main className="flex-grow p-4 md:p-6 w-full max-w-5xl mx-auto">
                        {currentView === 'form' && (
                            <DutyForm 
                                user={currentUser} 
                                saveReport={saveReport} 
                                reports={reports}
                                getDayName={getDayName}
                                showToast={showToast}
                            />
                        )}
                        {(currentView === 'admin' || currentView === 'list') && (
                            <AdminDashboard 
                                reports={reports} 
                                role={currentUser.role}
                                onViewReport={(date) => {
                                    setSelectedDate(date);
                                    setCurrentView('report');
                                }}
                            />
                        )}
                        {currentView === 'report' && (
                            <CombinedReport 
                                reportData={reports[selectedDate]} 
                                date={selectedDate}
                                user={currentUser}
                                                             onSaveComment={async (comment) => {
                                    showToast("Menyimpan ulasan pentadbir...");
                                    try {
                                        const payload = {
                                            action: "SAVE_COMMENT",
                                            date: selectedDate,
                                            day: reports[selectedDate]?.day || "",
                                            week: reports[selectedDate]?.week || "",
                                            comment: comment,
                                            adminName: currentUser.name
                                        };

                                        await fetch(GOOGLE_SCRIPT_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: {
                                                'Content-Type': 'text/plain;charset=utf-8'
                                            },
                                            body: JSON.stringify(payload)
                                        });

                                        setReports(prev => ({
                                            ...prev,
                                            [selectedDate]: { ...prev[selectedDate], admin_comment: comment, status: 'reviewed' }
                                        }));
                                        showToast("Ulasan pentadbir berjaya disimpan ke pangkalan data!");
                                    } catch (err) {
                                        console.error('Gagal hantar ulasan:', err);
                                        showToast("Ralat: Gagal menyimpan ulasan ke pelayan.");
                                    }
                                }}
                            />
                        )}
                    </main>
                </div>
            );
        };
        const DutyForm = ({ user, saveReport, reports, getDayName, showToast }) => {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [week, setWeek] = React.useState("");
            const [dutyId, setDutyId] = React.useState("");
            const [taskData, setTaskData] = React.useState({});

        const getDriveFileId = (url) => {
            const value = String(url || '').trim();
            if (!value) return '';
            const match = value.match(/[?&]id=([^&]+)/) || value.match(/\/d\/([^/]+)/);
            return match ? match[1] : '';
        };

        const getImageCandidates = (url) => {
            const original = String(url || '').trim();
            if (!original) return [];
            const fileId = getDriveFileId(original);
            if (!fileId) return [original];
            return [
                `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`,
                `https://drive.google.com/uc?export=view&id=${fileId}`,
                original
            ];
        };

        const DriveImage = ({ url, alt, className }) => {
            const [src, setSrc] = React.useState('');
            const [status, setStatus] = React.useState('loading');

            React.useEffect(() => {
                let cancelled = false;
                const fileId = getDriveFileId(url);

                if (!fileId) {
                    setSrc(url || '');
                    setStatus(url ? 'ready' : 'error');
                    return () => { cancelled = true; };
                }

                const proxyUrl = `${GOOGLE_SCRIPT_URL}?imageId=${encodeURIComponent(fileId)}`;

                fetch(proxyUrl)
                    .then(r => r.json())
                    .then(data => {
                        if (cancelled) return;
                        if (data.status === 'success' && data.dataUrl) {
                            setSrc(data.dataUrl);
                            setStatus('ready');
                        } else {
                            const fallback = getImageCandidates(url)[0] || url;
                            setSrc(fallback);
                            setStatus('fallback');
                        }
                    })
                    .catch(() => {
                        if (cancelled) return;
                        const fallback = getImageCandidates(url)[0] || url;
                        setSrc(fallback);
                        setStatus('fallback');
                    });

                return () => { cancelled = true; };
            }, [url]);

            if (status === 'loading') {
                return <div className="w-full h-48 rounded bg-slate-100 flex items-center justify-center text-xs text-slate-400">Memuat gambar...</div>;
            }

            if (!src) {
                return <div className="w-full h-48 rounded bg-slate-100 flex items-center justify-center text-xs text-red-500">Gambar tidak dapat dipaparkan.</div>;
            }

            return (
                <img
                    src={src}
                    className={className}
                    alt={alt}
                    loading="eager"
                    referrerPolicy="no-referrer"
                    onError={(e) => {
                        const fallback = getImageCandidates(url);
                        const current = e.currentTarget.dataset.fallbackIndex ? Number(e.currentTarget.dataset.fallbackIndex) : 0;
                        const next = current + 1;
                        if (next < fallback.length) {
                            e.currentTarget.dataset.fallbackIndex = String(next);
                            e.currentTarget.src = fallback[next];
                            return;
                        }
                        e.currentTarget.style.display = 'none';
                        const box = e.currentTarget.parentElement;
                        if (box && !box.querySelector('.image-error-msg')) {
                            const msg = document.createElement('p');
                            msg.className = 'image-error-msg text-xs text-red-500 mt-2';
                            msg.textContent = 'Gambar tidak dapat dipaparkan di sini.';
                            box.appendChild(msg);
                        }
                    }}
                />
            );

                    </div>

                    <div className="bg-white p-8 md:p-12 rounded-xl shadow-md border border-slate-200 text-sm md:text-base text-slate-800 leading-relaxed print:shadow-none print:border-none print:p-0">
                        <div className="text-center mb-8 border-b-2 border-slate-800 pb-4">
                            <h1 className="text-2xl font-bold uppercase tracking-wider mb-2">Laporan Guru Bertugas Harian</h1>
                            <h2 className="text-xl font-bold text-teal-800 uppercase">SMK Kem Terendak, Melaka</h2>
                            
                            <div className="flex justify-center gap-8 mt-6">
                                <div className="bg-slate-50 px-6 py-2 rounded-lg border font-semibold">
                                    <span className="text-slate-500 text-xs block uppercase">Tarikh</span>
                                    {date}
                                </div>
                                <div className="bg-slate-50 px-6 py-2 rounded-lg border font-semibold">
                                    <span className="text-slate-500 text-xs block uppercase">Hari</span>
                                    {reportData.day}
                                </div>
                                <div className="bg-slate-50 px-6 py-2 rounded-lg border font-semibold">
                                    <span className="text-slate-500 text-xs block uppercase">Minggu</span>
                                    {reportData.week}
                                </div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h3 className="font-bold text-lg bg-teal-50 p-2 border-l-4 border-teal-600 mb-3">A. SENARAI GURU BERTUGAS</h3>
                            <table className="w-full border-collapse border border-slate-300">
                                <tbody>
                                    {[1,2,3,4,5].map(id => {
                                        const taskName = DUTIES.find(d=>d.id === id).title;
                                        const teacher = reportData.tasks[id]?.teacherName || <span className="text-red-500 italic">Belum diisi</span>;
                                        return (
                                            <tr key={id} className="border-b border-slate-300">
                                                <td className="p-2 border-r border-slate-300 font-medium w-8 text-center">{id}</td>
                                                <td className="p-2 border-r border-slate-300 font-bold text-teal-800 w-1/2">{teacher}</td>
                                                <td className="p-2 text-sm">{taskName}</td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>

                        <div className="mb-6 print-break-inside-avoid">
                            <h3 className="font-bold text-lg bg-teal-50 p-2 border-l-4 border-teal-600 mb-3">B. KEHADIRAN GURU DAN AKP</h3>
                            <div className="flex gap-4 mb-4">
                                <table className="border-collapse border border-slate-300 w-1/2">
                                    <thead><tr className="bg-slate-100"><th className="p-2 border border-slate-300 text-left">Kategori</th><th className="p-2 border border-slate-300 text-center">Hadir</th><th className="p-2 border border-slate-300 text-center">Jumlah</th></tr></thead>
                                    <tbody>
                                        <tr><td className="p-2 border border-slate-300 font-semibold">GURU</td><td className="p-2 border border-slate-300 text-center">{t5.guru_hadir || '-'}</td><td className="p-2 border border-slate-300 text-center">{t5.guru_total || '-'}</td></tr>
                                        <tr><td className="p-2 border border-slate-300 font-semibold">AKP</td><td className="p-2 border border-slate-300 text-center">{t5.akp_hadir || '-'}</td><td className="p-2 border border-slate-300 text-center">{t5.akp_total || '-'}</td></tr>
                                    </tbody>
                                </table>
                            </div>
                            {t5.guru_tak_hadir && (
                                <div className="mb-2">
                                    <p className="font-bold text-sm underline mb-1">Senarai Nama Staf Tidak Hadir / Catatan:</p>
                                    <div className="pl-4 text-sm whitespace-pre-line">{t5.guru_tak_hadir}</div>
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 print-break-inside-avoid">
                            <div className="border border-slate-300 p-4 rounded bg-slate-50/50">
                                <h3 className="font-bold border-b border-slate-300 pb-2 mb-3 text-teal-800">C. LAPORAN PERHIMPUNAN & PENGUMUMAN</h3>
                                <div>{renderText(t1.notes)}</div>
                            </div>
                            <div className="border border-slate-300 p-4 rounded bg-slate-50/50">
                                <h3 className="font-bold border-b border-slate-300 pb-2 mb-3 text-teal-800">D. KAWALAN PINTU MASUK PAGI</h3>
                                <p className="mb-2"><span className="font-semibold">Status:</span> {t2.status ? <span className="px-2 py-1 bg-white border rounded shadow-sm text-sm">{t2.status}</span> : '-'}</p>
                                <p className="font-semibold mt-3 mb-1">Catatan/Isu:</p>
                                <div>{renderText(t2.notes)}</div>
                            </div>
                        </div>

                        <div className="mb-6 border border-slate-300 p-4 rounded print-break-inside-avoid">
                            <h3 className="font-bold border-b border-slate-300 pb-2 mb-3 text-teal-800">E. KAWALAN WAKTU REHAT DI KANTIN & KOPERASI</h3>
                            <div className="flex flex-wrap gap-x-8 gap-y-2 mb-4">
                                <p><span className="font-semibold text-slate-500">Kantin:</span> {t3.canteen_clean || '-'}</p>
                                <p><span className="font-semibold text-slate-500">Koperasi:</span> {t3.coop_clean || '-'}</p>
                                <p><span className="font-semibold text-slate-500">Disiplin Murid:</span> {t3.discipline || '-'}</p>
                            </div>
                            <p className="font-semibold mb-1">Catatan:</p>
                            <div>{renderText(t3.notes)}</div>
                        </div>

                        <div className="mb-6 border border-slate-300 p-4 rounded print-break-inside-avoid">
                            <h3 className="font-bold border-b border-slate-300 pb-2 mb-3 text-teal-800">F. RONDAAN BLOK, SURAU DAN TANDAS</h3>
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">
                                <p><span className="text-slate-500">Blok Kelas:</span> <span className="font-semibold">{t4.block_clean || '-'}</span></p>
                                <p><span className="text-slate-500">Surau Lelaki:</span> <span className="font-semibold">{t4.surau_l || '-'}</span></p>
                                <p><span className="text-slate-500">Surau Pmpn:</span> <span className="font-semibold">{t4.surau_p || '-'}</span></p>
                                <p><span className="text-slate-500">Tandas Lelaki:</span> <span className="font-semibold">{t4.tandas_l || '-'}</span></p>
                                <p><span className="text-slate-500">Tandas Pmpn:</span> <span className="font-semibold">{t4.tandas_p || '-'}</span></p>
                            </div>
                            <p className="font-semibold mb-1">Catatan/Isu Kerosakan:</p>
                            <div className="text-red-700">{renderText(t4.notes)}</div>
                        </div>

                        <div className="mb-6 border border-slate-300 p-4 rounded print-break-inside-avoid">
                            <h3 className="font-bold border-b border-slate-300 pb-2 mb-3 text-teal-800">G. KEHADIRAN MURID & AKTIVITI</h3>
                            <table className="w-full mb-3 border border-slate-200">
                                <tbody>
                                    <tr className="border-b"><td className="p-2 bg-slate-50 font-semibold w-1/3">Kehadiran Murid</td><td className="p-2">{t5.murid_hadir || '-'} / {t5.murid_total || '-'}</td></tr>
                                    <tr className="border-b"><td className="p-2 bg-slate-50 font-semibold align-top">Murid Sakit / Pulang</td><td className="p-2 whitespace-pre-line">{t5.murid_sakit || '-'}</td></tr>
                                    <tr><td className="p-2 bg-slate-50 font-semibold">Aktiviti Selepas Waktu</td><td className="p-2">{t5.aktiviti || '-'}</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div className="mb-6 print-break-inside-avoid">
                            <h3 className="font-bold text-lg bg-teal-50 p-2 border-l-4 border-teal-600 mb-3">H. LAPORAN BERGAMBAR</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {[t1, t2, t3, t4].map((t, idx) => (
                                    t && t.image ? (
                                        <div key={idx} className="border p-2 rounded shadow-sm text-center bg-white">
                                            <DriveImage
                                                url={t.image}
                                                alt={`Gambar Tugasan ${idx+1}`}
                                                className="w-full h-48 object-contain rounded mb-2 bg-slate-100"
                                            />
                                            <a
                                                href={t.image}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-block text-xs text-teal-700 hover:text-teal-900 underline mb-2"
                                            >
                                                Buka gambar
                                            </a>
                                            <span className="text-xs font-semibold text-slate-500 uppercase block">{DUTIES[idx].short}</span>
                                        </div>
                                    ) : null
                                ))}
                                {(!t1?.image && !t2?.image && !t3?.image && !t4?.image) && (
                                    <p className="col-span-4 text-center italic text-slate-400 p-4 border border-dashed">Tiada gambar dimuat naik.</p>
                                )}
                            </div>
                        </div>

                        <div className="mt-10 border-t-2 border-dashed pt-6 print-break-inside-avoid">
                            <h3 className="font-bold text-lg mb-2 flex items-center gap-2">
                                <i className="ph-fill ph-seal-check text-blue-600"></i> Ulasan Pentadbir
                            </h3>
                            
                            {user?.role === 'admin' ? (
                                <div className="no-print bg-blue-50 p-4 rounded-lg border border-blue-200 mt-3 shadow-inner">
                                    <textarea 
                                        className="w-full border border-blue-300 rounded p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white" 
                                        rows="3" 
                                        placeholder="Sila masukkan ulasan atau tindakan susulan..."
                                        value={comment}
                                        onChange={(e) => setComment(e.target.value)}
                                    ></textarea>
                                    <button 
                                        onClick={() => onSaveComment(comment)}
                                        className="mt-3 bg-blue-600 text-white px-6 py-2.5 rounded text-sm font-bold hover:bg-blue-700 shadow flex items-center gap-2"
                                    >
                                        <i className="ph-bold ph-floppy-disk"></i> Simpan Ulasan
                                    </button>
                                </div>
                            ) : null}

                            {(reportData.admin_comment || user?.role !== 'admin') && (
                                <div className="mt-4 p-5 border-l-4 border-slate-800 bg-slate-50 italic text-slate-700 min-h-[60px] rounded-r">
                                    {reportData.admin_comment ? `"${reportData.admin_comment}"` : "Belum ada ulasan daripada pentadbir."}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
